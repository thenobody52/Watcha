name: Code Quality & Security Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Regenerate Fresh Gradle Wrapper
        run: |
          gradle wrapper
          chmod +x gradlew

      - name: Check Dependencies & Quality
        run: ./gradlew dependencies --stacktrace || true
